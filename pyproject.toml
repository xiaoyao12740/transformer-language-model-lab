[project]
name = "transformer-language-model-lab"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "PyYAML>=6", "matplotlib>=3.8", "streamlit>=1.35"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "E701", "E702", "E731", "B905"]
